name: follow-upstream

# 每天自动检查官方「正式版」，有新版本就自动打包并发布 Release。
# - 只跟正式版（prerelease=false 的四段 tag）；beta 通道仅在手动运行时可用。
# - 构建成功后自动发布，无需人工点 publish-release.yml。
# - 已有同名 Release 或已构建过的版本会跳过，不会重复发布。
# - 需要复发布/改草稿时，仍可手动运行 publish-release.yml。

on:
  schedule:
    - cron: '17 3 * * *'      # 每天 03:17 UTC = 11:17 北京时间
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable = 官方正式版，beta = 官方 beta'
        type: choice
        options: [stable, beta]
        default: stable
      force:
        description: '忽略"该版本已构建"跳过，强制重建'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      built: ${{ steps.gate.outputs.built }}
      version: ${{ steps.up.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 探测上游最新版本
        id: up
        shell: pwsh
        run: |
          $ch = '${{ github.event.inputs.channel }}'
          if (-not $ch) { $ch = 'stable' }
          python scripts/fetch_upstream.py --channel $ch

      - name: 是否已构建过该版本
        id: gate
        shell: pwsh
        run: |
          $v = '${{ steps.up.outputs.version }}'
          $force = '${{ github.event.inputs.force }}' -eq 'true'
          $want = "fxsound-zh-$v"
          $names = @()
          try { $names = @(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].name') } catch { $names = @() }
          $built = $names -contains $want
          # Artifact 只保留 90 天，过期后不能用它判断"已构建"，改看 Release tag
          $relExists = $false
          & gh release view "v$v-zh" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $relExists = $true }
          if ($relExists) { $built = $true }
          if ($force) { $built = $false }
          "built=$($built.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v built=$built artifact=$($names -contains $want) release=$relExists force=$force"
          exit 0

      - name: 下载官方安装包
        if: steps.gate.outputs.built == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work, vendor, dist | Out-Null
          $url = '${{ steps.up.outputs.asset_url }}'
          $id  = '${{ steps.up.outputs.asset_id }}'
          $out = 'vendor\fxsound_setup.exe'
          try {
            curl.exe -sS -L --retry 3 --max-time 900 -A "Mozilla/5.0" -o $out $url
          } catch { }
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 40MB) {
            Write-Host ">> 直连失败，改走 API 资产通道"
            curl.exe -sS -L --retry 3 --max-time 900 -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -o $out "https://api.github.com/repos/fxsound2/fxsound-app/releases/assets/$id"
          }
          $f = Get-Item $out
          Write-Host "官方安装包: $([math]::Round($f.Length/1MB,2)) MB"
          if ($f.Length -lt 40MB) { throw '官方安装包下载失败' }
          (Get-FileHash $out -Algorithm SHA256).Hash | Out-File vendor\official.sha256 -Encoding ASCII

      - name: 解包并定位程序目录
        if: steps.gate.outputs.built == 'false'
        id: unpack
        shell: pwsh
        run: |
          $lines = & .\scripts\unpack_official.ps1 -SetupPath 'vendor\fxsound_setup.exe' -WorkDir 'work\unpack'
          $lines | Write-Host
          $root = ($lines | Where-Object { $_ -like 'APP_ROOT=*' } | Select-Object -Last 1) -replace '^APP_ROOT=', ''
          if (-not $root) { throw '未取得 APP_ROOT' }
          "app_root=$root" >> $env:GITHUB_OUTPUT
          $fv = ($lines | Where-Object { $_ -like 'FILE_VERSION=*' } | Select-Object -Last 1) -replace '^FILE_VERSION=', ''
          "file_version=$fv" >> $env:GITHUB_OUTPUT
          Write-Host "官方程序实际版本: $fv"
          $drv = Get-ChildItem $root -Recurse -Include 'fxvad*.inf','dfx*.inf' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $drv) { $drv = Get-ChildItem $root -Recurse -Filter '*.inf' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($drv) { "driver_inf=$($drv.FullName)" >> $env:GITHUB_OUTPUT; Write-Host "驱动 inf: $($drv.FullName)" } else { Write-Host "!! 未找到 inf（便携版驱动脚本将跳过）" }
          exit 0

      - name: 注入中文预设名
        if: steps.gate.outputs.built == 'false'
        shell: pwsh
        run: |
          python scripts/patch_presets.py --app-root '${{ steps.unpack.outputs.app_root }}'

      - name: 组装便携版
        if: steps.gate.outputs.built == 'false'
        shell: pwsh
        run: |
          .\packaging\make_portable.ps1 -AppRoot '${{ steps.unpack.outputs.app_root }}' -Version '${{ steps.up.outputs.version }}' -OutDir 'dist'

      - name: 生成安装器用预设名表
        if: steps.gate.outputs.built == 'false'
        shell: pwsh
        run: |
          python -c "import json,io; d=json.load(open('presets/preset-map.json',encoding='utf-8')); open('packaging/preset_names.tsv','w',encoding='utf-8',newline='').write(''.join(k+'\t'+v['zh']+'\n' for k,v in d['presets'].items()))"
          Get-Content packaging\preset_names.tsv

      - name: 编译安装版（Inno Setup）
        if: steps.gate.outputs.built == 'false'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName }
          $env:FX_VERSION = '${{ steps.up.outputs.version }}'
          & $iscc /Qp packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败 exit=$LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: 汇总校验值
        if: steps.gate.outputs.built == 'false'
        shell: pwsh
        run: |
          $v = '${{ steps.up.outputs.version }}'
          "@FxSound 中文预设增强版 $v`n上游版本: ${{ steps.up.outputs.tag }} (${{ steps.up.outputs.published_at }})`n官方安装包 SHA256: $(Get-Content vendor\official.sha256)" | Out-File dist\VERSION.txt -Encoding UTF8

      - name: 上传产物
        if: steps.gate.outputs.built == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: fxsound-zh-${{ steps.up.outputs.version }}
          path: dist/*
          retention-days: 90

      - name: 已存在同版本构建
        if: steps.gate.outputs.built == 'true'
        shell: pwsh
        run: Write-Host "上游版本 ${{ steps.up.outputs.version }} 已构建/已发布过，跳过。需要重建请勾选 force。"

  # 只有「正式版」且本次真的构建了才自动发布；beta 与已构建过的版本一律跳过。
  publish:
    needs: build
    if: needs.build.outputs.built == 'false' && (github.event_name == 'schedule' || github.event.inputs.channel == 'stable')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fxsound-zh-${{ needs.build.outputs.version }}
          path: dist

      - name: 已存在同名 Release 则跳过
        id: dup
        run: |
          TAG="v${V}-zh"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release $TAG 已存在，跳过发布"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 发布 Release
        if: steps.dup.outputs.skip == 'false'
        run: |
          set -e
          TAG="v${V}-zh"
          ls -lh dist
          {
            echo "基于官方 ${V} 安装包，仅将预设显示名改为中文，其余与官方一致。"
            echo ""
            echo "- 安装版：\`FxSound-zh-CN-${V}-setup.exe\`"
            echo "- 便携版：\`FxSound-zh-CN-${V}-portable.zip\`（解压后先以管理员身份运行 \`安装驱动.cmd\`，否则无输出设备）"
            echo ""
            echo "非官方版本，与 FxSound LLC 无隶属关系。程序、驱动与数字签名均为官方原件，未做修改。请支持官方正版：https://www.fxsound.com"
            echo ""
            echo "对应源码见上游仓库 https://github.com/fxsound2/fxsound-app （AGPL-3.0）。"
          } > notes.md
          gh release create "$TAG" dist/FxSound-zh-CN-*.zip dist/FxSound-zh-CN-*.exe dist/VERSION.txt \
            --repo "${{ github.repository }}" \
            --title "FxSound 中文预设增强版 ${V}" \
            --notes-file notes.md
